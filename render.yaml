# Render Blueprint. Free tier: sleeps after 15 min idle (30-60 s cold start); disk is ephemeral, so the spend
# ledger resets on redeploy. The provider-side spend limits are the hard backstop regardless.
services:
  - type: web
    name: hubrisk
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run agent serve --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: BUDGET_USD
        value: "5"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DB_PATH
        value: /tmp/agent.db
      - key: ALERT_INTERVAL_MIN
        value: "30"
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: NWS_USER_AGENT
        value: "hubrisk/0.1 (github.com/ozeriyarin/hubrisk)"

[project]
name = "hubrisk"
version = "0.1.0"
description = "HubRisk: weather disruption risk agent for US distribution hubs. Deterministic KPI, typed LLM output, cross-vendor fallback, guard, budget cap, evals."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "pydantic-ai-slim[anthropic,openai,google,typesafe,retries]==2.63.0",
    "fastapi==0.162.0",
    "uvicorn>=0.34",
    "typer>=0.15",
    "pyyaml>=6.0",
    "python-dotenv>=1.1",
    "duckdb>=1.1",
    "tzdata>=2024.1",
]

[project.scripts]
agent = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::pydantic_ai.usage.CostNotFoundWarning"]
markers = ["live: calls real providers and spends money (opt-in with -m live)"]
addopts = "-m 'not live'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E731"]
